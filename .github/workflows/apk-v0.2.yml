name: APK v0.2

# DRAFT — install as .github/workflows/apk-v0.2.yml in the Guardianlink
# repo (see MODULE-INTEGRATION.md §3). Modeled on the existing apk.yml.
#
# Builds the GuardianLink v0.2 Android app (android-app-v2) and attaches
# an installable debug APK. Unlike the scaffold module, this workflow
# runs the module's unit tests first: the v0.2 core is pure Kotlin and
# its JUnit 5 suites are part of the build's claim (PORT-MAP §e step 5).
#
# Gate 3 ZK (ZK-GATE3-DESIGN §7.2): the workflow also (a) runs the Rust
# glzk crate's own test suite on the host — the proof logic's real
# verification — and (b) cross-compiles libglzk.so for arm64-v8a with
# cargo-ndk into the module's jniLibs BEFORE Gradle runs, so the APK
# packages it. No .so is ever committed; it is built here like
# everything else. The uniFFI Kotlin bindings ARE committed
# (android-app-v2/src/main/kotlin/uniffi/glzk/glzk.kt, generated from
# uniffi 0.28.3); regenerate them locally when the FFI surface changes
# (see zk-bridge/README.md) — CI does not regenerate.
#
# Toolchain discipline: the crate pins Rust 1.85.0
# (zk-bridge/rust-toolchain.toml). curve25519-dalek 4.1.3's build
# script does not survive newer rustc (verified locally against
# 1.97.0), so do not float this toolchain.

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app-v2/**'
      - 'zk-bridge/**'
      - 'src/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/apk-v0.2.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app-v2/**'
      - 'zk-bridge/**'
  workflow_dispatch:

jobs:
  glzk-cargo-test:
    # The proof system's own verification: dalek vectors + the
    # statement-level attack corpus (zk-bridge/tests/gate3_proofs.rs).
    # Pure host Rust — no Android involved.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (pinned by zk-bridge/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Cargo test (glzk, release)
        working-directory: zk-bridge
        run: cargo test --release

  apk-v02:
    needs: glzk-cargo-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;27.2.12479018'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Rust toolchain for the Android cross-compile
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        # Tool pin: cargo-ndk 4.1.2 requires rustc >= 1.86, but the
        # crate is pinned to Rust 1.85.0 (curve25519-dalek 4.1.3's
        # build script breaks on newer rustc) — 3.5.4 is the newest
        # cargo-ndk supporting this toolchain. Verified by CI failure
        # on 2026-10-23 (run 40048732082).
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build libglzk.so (arm64-v8a) into the module's jniLibs
        # cargo-ndk 3.5.4 does not forward --manifest-path to its
        # metadata probe; run from the crate directory instead.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd zk-bridge
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/android-app-v2/src/main/jniLibs" build --release
          ls -la "$GITHUB_WORKSPACE/android-app-v2/src/main/jniLibs/arm64-v8a/"
      - name: Unit tests (v0.2 pure-Kotlin core)
        run: ./gradlew :android-app-v2:testDebugUnitTest --stacktrace
      - name: Show test result counts (guards against silent zero-test runs)
        run: |
          for f in android-app-v2/build/test-results/testDebugUnitTest/*.xml; do
            grep -o '<testsuite[^>]*' "$f" | head -1
          done
      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: guardianlink-v0.2-test-results
          path: android-app-v2/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - name: Build debug APK
        run: ./gradlew :android-app-v2:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: guardianlink-v0.2-debug-apk
          path: android-app-v2/build/outputs/apk/debug/*.apk
          if-no-files-found: error
